name: pgvector-integration

on:
  push:
    branches:
      - codex/postgresql-pgvector-fts
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: knowledge_pgvector_verify
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge_pgvector_verify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@127.0.0.1:5432/knowledge_pgvector_verify
      QWEN_API_KEY_FILE: /tmp/qwen-key-not-required-for-smoke

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install backend
        run: python -m pip install -e '.[dev]'

      - name: Static and unit verification
        run: |
          ruff check app alembic tests scripts
          pytest

      - name: Empty-database migration
        run: alembic upgrade head

      - name: Real PostgreSQL FTS and pgvector verification
        run: knowledge-pgvector-smoke

      - name: Frontend build
        run: |
          npm ci
          npm run build
