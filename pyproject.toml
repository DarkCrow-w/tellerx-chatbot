[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tellerx-knowledge-chatbot"
version = "0.1.0"
description = "Evidence-first internal knowledge chatbot with a local Python and Vite runtime"
requires-python = ">=3.12"
dependencies = [
  # 固定直接依赖，保证内部机器重复安装时得到一致运行环境。
  "alembic==1.19.1",
  "beautifulsoup4==4.15.0",
  "fastapi==0.141.1",
  "httpx[http2]==0.28.1",
  "openai==3.6.0",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.15.0",
  "pypdf==6.15.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "PyYAML==6.0.3",
  "sqlalchemy==2.0.52",
  "truststore==0.10.4",
  "uvicorn[standard]==0.52.1",
]

[project.scripts]
tellerx-backend = "app.commands.local_server:main"
model-diagnostics = "app.commands.diagnostics:diagnostics_main"
knowledge-reindex = "app.commands.reindex:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.extend-per-file-ignores]
"app/api/routes/*.py" = ["B008"]

[tool.ruff.lint.mccabe]
max-complexity = 10
