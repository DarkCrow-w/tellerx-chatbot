services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: knowledge_crossdoc_verify
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_crossdoc_verify"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - verify-postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: runtime
    env_file: ${TELLERX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/knowledge_crossdoc_verify
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    env_file: ${TELLERX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/knowledge_crossdoc_verify
      MODEL_API_KEY_FILE: /run/secrets/model_api_key
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - model_api_key
    ports:
      - "${TELLERX_VERIFY_PORT:-18000}:8000"
    volumes:
      - verify-uploads:/data/knowledge

  worker:
    build:
      context: .
      target: worker-runtime
    env_file: ${TELLERX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/knowledge_crossdoc_verify
      MODEL_API_KEY_FILE: /run/secrets/model_api_key
    command: ["knowledge-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - model_api_key
    volumes:
      - verify-uploads:/data/knowledge

  indexer:
    build:
      context: .
      target: runtime
    env_file: ${TELLERX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/knowledge_crossdoc_verify
      MODEL_API_KEY_FILE: /run/secrets/model_api_key
    command: ["knowledge-indexer"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - model_api_key
    volumes:
      - verify-uploads:/data/knowledge

  quality:
    build:
      context: .
      target: quality-runtime
    env_file: ${TELLERX_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/knowledge_crossdoc_verify
      MODEL_API_KEY_FILE: /run/secrets/model_api_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - model_api_key
    volumes:
      - verify-uploads:/data/knowledge

secrets:
  model_api_key:
    file: "${MODEL_API_KEY_SECRET_FILE:-./Qwen/Qwen token.txt}"

volumes:
  verify-postgres-data:
  verify-uploads:
